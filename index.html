<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Calendario de Adviento</title>
  <meta name="theme-color" content="#7a1020">
  <link rel="icon" href="galleta.png">
  <link rel="apple-touch-icon" href="galleta.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=IM+Fell+English:ital@0;1&family=Mountains+of+Christmas:wght@400;700&family=Montserrat:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,500&family=Great+Vibes&family=Inter:wght@400;600&family=Berkshire+Swash&family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=17.12">
</head>
<body>
  <div class="snow" aria-hidden="true"></div>
  <main id="app"><div class="loading">❄</div></main>

  <!-- Filtro SVG para arrugar el papel -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="crumpleFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <script type="module" src="app.js?v=17.12"></script>
</body>
</html>
